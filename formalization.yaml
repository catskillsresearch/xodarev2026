known_gaps:
  - >-
    No open problems. False paper claims are registered through their Lean
    negations, not the claims; each has a short narrative in
    Writeup/narratives/. Theorem 4.2(ii) ← (not_affine_riccati_duality_mpr,
    for every SignatureVolatilityModel and driver, with no HypH3): the family
    u₀^(λ) = 2λe_[1,1,1] − λe_[1,0] − 12λ²e_[1,1,1,1,0] has ℛ(u₀^(λ)) = 0 and
    ∫ exp⟨u₀^(λ),Ŵ_t⟩ dP ≤ 1, so the hypotheses of the universal ← claim hold,
    but that claim is false. Lean proves the factorisation
    E[exp⟨u₀^(λ),Ŵ_T⟩ | ℱ_{t_λ}] = exp⟨u₀^(λ),Ŵ_{t_λ}⟩·v₁(λ^{1/3}W_{t_λ}) with
    v₁ → 0 at +∞; a Riccati representation for all λ ≥ 1 would make log v₁ an
    entire function of exponential type 0 with quartic growth, hence a
    polynomial bounded on (−∞, 0], hence constant — contradiction. Lean does
    not state a theorem that the exponential is a local martingale or that it
    is not a true martingale. not_affine_riccati_duality is the corresponding
    negation of the iff, under the same hypotheses. not_theorem_B_mpr and
    not_theorem_B are the same ← failure and the failure of the full Theorem B
    conjunction, each with an additional unused HypH3 hypothesis (HypH3 is
    satisfiable, e.g. constant volatility).
  - >-
    Theorem C, Proposition 58 and the Theorem D residual hypothesis: the
    compared refutation not_theorem_C_unwrapped is a refutation of the
    unconditional completeness-depth equivalence (for any finite strike set)
    and of the paper's separate Black–Scholes depth claim, not a counterexample
    inside Theorem 56's finite-polynomial subcase K(N^*_S) < ∞ with a
    sufficiently rich strike set. The non-compared library refutation of
    Proposition 58, and the compared failure of the residual hypothesis, are
    likewise for the Black–Scholes market (T > 0, s₀ > 0, σ₀ ≠ 0,
    one-dimensional Brownian motion). In Black–Scholes, L²(ℱ^S_T) is
    infinite-dimensional, while Definition 55 depth N spans finitely many
    signature coordinates; hence N^*_S = ∞ (not 0), although the market is
    complete with finitely many calls (in fact the Lean completeness proof
    uses no calls). Theorem D's residual expansion is shown only to have a
    failed hypothesis for Black–Scholes, not to be false when the hypothesis
    holds. Separately, theorem_C_depth_infinite gives N^*_S = ∞ for every
    MarketData with infinite-dimensional L²(ℱ^S_T).
  - >-
    Lemmas 77 and 78 (proved in the library, not compared): for every weight w and every letter ℓ, ℓ^k ⧢ ℓ = (k+1)ℓ^{k+1}
    defeats any shuffle constant on basis words. not_lemma77_of_hypH2 is the
    same conclusion with unused HypH2. Lemma 78: only for w ≡ 1, ℛ(e_{ℓ^{k+1}})
    has coefficient ½·binom(2k,k) at ℓ^{2k}, so ℛ is not locally Lipschitz on
    bounded subsets of T_w (it is unbounded on the unit ball).

limitations:
  - >-
    No external mathematical review has been performed.
  - >-
    Source PDF/TeX and OCR transcriptions are not Apache-2.0; see NOTICE.

alignment:
  namespace: SignatureVolatility
  statements:
  - source: "Thm A: under the model's H1, H2 and analytic HypH3, a price process S with IsSignaturePrice exists (S₀ = s₀, adapted to the signature filtration, strictly positive, almost surely continuous paths on [0, T], almost sure Doléans representation at each t ∈ [0, T], SDE, L²-supremum, martingale on the signature filtration) and is unique among signature-adapted KitStrongSolutionClass solutions of the integral equation. The packaged SignaturePriceSolution used by theorem_A remains a pointwise Doléans representation."
    lean: theorem_A_unwrapped
    module: SignatureVolatility.Unwrapped
    status: proved
  - source: "Thm B fragment theorem_B_mp, under analytic HypH3: martingale, Delbaen–Schachermayer NFLVR (SatisfiesNFLVR_DS) for the cone BoundedBelowGains of uniformly bounded-below admissible strategies whose integrand H S σ lies in ℱ^W-predictable L² and whose wealth is a continuous genuine L² Itô integral against W⁰ (narrower than the paper's local class ∫ H² d⟨S⟩ < ∞ a.s.), for that same process S, special semimartingale coordinates, and → Riccati. The bundled theorem_B_mp asserts the same NFLVR for a continuous version of the packaged solution. Not a proof of the paper's full Theorem B conjunction."
    lean: theorem_B_mp_unwrapped
    module: SignatureVolatility.Unwrapped
    status: proved
  - source: "Thm 4.2(ii), → direction: if the exponential-affine conditional-expectation formula holds through some classical Riccati solution, then a classical Riccati solution exists. No HypH3."
    lean: affine_riccati_duality_mp
    module: SignatureVolatility.SignatureRiccatiKit.AffineRiccatiDualityMp
    status: proved
  - source: "Thm 4.2(ii) ← refuted, for every model and driver, with no HypH3: the universal exponential-affine conditional-expectation formula fails. The proof uses u₀^(λ) = 2λe_[1,1,1] − λe_[1,0] − 12λ²e_[1,1,1,1,0], for which ℛ(u₀) = 0 and the signature transform is finite. Lean does not state that the exponential is not a true martingale (Writeup/narratives/affine_riccati_duality_mpr.md)."
    lean: not_affine_riccati_duality_mpr_unwrapped
    module: SignatureVolatility.Unwrapped
    status: proved
  - source: "Thm 4.2(ii) iff refuted, for every model and driver, with no HypH3 (corollary of the ← counterexample)."
    lean: not_affine_riccati_duality_unwrapped
    module: SignatureVolatility.Unwrapped
    status: proved
  - source: "Thm B ← Riccati clause refuted (corollary of not_affine_riccati_duality_mpr), under an additional unused HypH3 hypothesis."
    lean: not_theorem_B_mpr_unwrapped
    module: SignatureVolatility.Unwrapped
    status: proved
  - source: "Thm B (full conjunction, including the Riccati iff) refuted (corollary), under an additional unused HypH3 hypothesis."
    lean: not_theorem_B_unwrapped
    module: SignatureVolatility.Unwrapped
    status: proved
  - source: "Unconditional form of Thm C (any finite strike set, no K(N^*_S)<∞ or rich-strike hypothesis): complete with finitely many calls ⇔ N^*_S < ∞ is false for Black–Scholes (T > 0, s₀ > 0, σ₀ ≠ 0, 1-dimensional Brownian motion); the market is complete, but Definition 55 gives N^*_S = ∞, so the paper's separate Black–Scholes depth claim also fails. This is not a counterexample inside Theorem 56's finite-polynomial subcase K(N^*_S)<∞ with a sufficiently rich strike set. Complete means every X in L²(F^S_T) is a.s. c + Σ_k a_k (S_T − k)^+ + G with G in the L²-closed span of elementary Brownian integrals on [0, T] (CounterExample_TheoremC)."
    lean: not_theorem_C_unwrapped
    module: SignatureVolatility.Unwrapped
    status: proved
  - source: "Same refutation of the unconditional completeness equivalence and of the Black–Scholes depth claim as not_theorem_C. Not a counterexample inside Theorem 56's finite-polynomial, rich-strike subcase."
    lean: theorem_C_refuted
    module: SignatureVolatility.TheoremC
    status: proved
  - source: "Black–Scholes is complete on F^S_T with finitely many calls, for every finite strike set (the Lean proof uses no calls)."
    lean: blackScholes_isCompleteWithCalls
    module: SignatureVolatility.TheoremCCounterExample
    status: proved
  - source: "For every MarketData with infinite-dimensional L²(F^S_T), N^*_S = ∞ and no finite-depth closed signature span is dense in L²(F^S_T)."
    lean: theorem_C_depth_infinite
    module: SignatureVolatility.TheoremC
    status: proved
  - source: "For Black–Scholes (T > 0, s₀ > 0, σ₀ ≠ 0, 1-dimensional Brownian motion), N^*_S = ∞ and no finite-depth span is dense."
    lean: theorem_C_blackScholes_depth_infinite
    module: SignatureVolatility.TheoremC
    status: proved
  - source: "Thm D / Thm 66, GKW projection only (Half_TheoremD), for every Market (model, driver, HypH3): unique decomposition X = (∫X)·1 + G + ε in L²(F^S_T). Does not identify G as ∫ H dS."
    lean: theorem_D_unwrapped
