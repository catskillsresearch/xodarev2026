# xodarev2026 — Palomar packaging (Challenge/Solution/comparator).
version: v0.5
project:
  name: Xodarev Signature Volatility Models in Lean 4
  description: >-
    A Lean 4 / Mathlib formalization of Akmal Xodarev, "On the Structural
    Foundations of Signature Volatility Models", arXiv:2605.17142. Framing:
    rigorous verification of Theorems A–D, proving what holds at paper
    strength and refuting what does not. Proved: Theorem A (global existence
    and uniqueness of the positive strong solution of the signature SDE under
    H1–H3); Theorem B except the ← direction of its Riccati clause
    (theorem_B_mp: martingale, NFLVR, special semimartingale, → Riccati); the → direction of the affine / Riccati duality of
    Theorem 4.2(ii) (affine_riccati_duality_mp); and the GKW projection part
    of Theorem D (theorem_D, Half_TheoremD). Refuted by Lean counterexamples:
    the ← direction of the affine / Riccati duality of Theorem 4.2(ii)
    (not_affine_riccati_duality_mpr, via the tensor family
    u₀ = 2λe_[1,1,1] − λe_[1,0] − 12λ²e_[1,1,1,1,0] with ℛ(u₀) = 0, whose
    exponential is a positive local martingale but not a true martingale),
    hence the iff (not_affine_riccati_duality) and Theorem B's ← clause and
    full statement (not_theorem_B_mpr, not_theorem_B);
    Theorem C (Black–Scholes is complete with finitely many calls but has
    completeness depth N^*_S = ∞), Proposition 58 (Black–Scholes depth is ∞,
    not 0), Lemma 77 (weighted shuffle estimate, for every (H2) weight) and
    Lemma 78 (local Lipschitz bound for the Riccati operator); and the
    residual-expansion hypothesis "N^*_S < ∞" of Theorem D fails for
    Black–Scholes. No open problems remain. Why each counterexample works:
    Writeup/narratives/ (one short file per refutation; verbatim outside
    source in Writeup/narratives/appendix/). Every compared theorem uses only
    propext, Quot.sound and Classical.choice. Project rule: no Lean `axiom`
    declarations. Akmal Xodarev did not participate in or endorse this
    formalization. Lean was written with AI-agent assistance under Lars
    Warren Ericson's direction and review.
  authors:
  - Lars Warren Ericson
  license: Apache-2.0
  responsible_maintainers:
  - Lars Warren Ericson
