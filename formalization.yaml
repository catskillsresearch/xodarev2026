known_gaps:
  - >-
    Open problem (the one gap): the ← direction of the affine / Riccati
    duality, paper Theorem 4.2(ii) p. 21, proof §4.4 p. 23
    (SignatureVolatility.affine_riccati_duality_mpr,
    OpenProblems/AffineRiccatiDuality.lean, sorry). It requires the positive
    local martingale exp⟨ψ(T − t), Ŵ_t⟩ to be a true martingale. The paper's
    argument is unsupported: H3 and polynomial moments do not give uniform
    integrability of the exponential, and Lemma 4.10 uses Lemmas B.1/B.2,
    which are false (not_lemma77_shuffle_estimate,
    not_lemma78_local_lipschitz). No counterexample is known;
    Cuchiero–Svaluto-Ferro–Teichmann (arXiv:2302.01362, Thm 3.5) assume the
    true-martingale property. Consequently the full paper Theorem B
    (theorem_B, OpenProblems/TheoremB.lean, from theorem_B_mp and the open
    theorem_B_mpr) is not compared; only theorem_B_mp is.
  - >-
    Theorem C, Proposition 58 and Lemmas 77/78 are false as stated; the
    Comparator family contains their Lean refutations, not the claims.
    Theorem D is proved only in its GKW-projection part; its residual
    expansion assumes N^*_S < ∞, which fails for Black–Scholes.

limitations:
  - >-
    No external mathematical review has been performed.
  - >-
    Source PDF/TeX and OCR transcriptions are not Apache-2.0; see NOTICE.

