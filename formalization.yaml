# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# xodarev2026 — Palomar packaging (Challenge/Solution/comparator).
version: v0.4
project:
  name: Xodarev Signature Volatility Models in Lean 4
  description: >-
    A Lean 4 / Mathlib formalization of Akmal Xodarev, "On the Structural
    Foundations of Signature Volatility Models", arXiv:2605.17142. Palomar
    registration: TBD. Framing: prove the paper claims that hold, at the exact
    strength of the Lean theorems below, and refute the claims that do not, by
    Lean negations of those claims and nothing stronger. Theorems A–D and their
    refutations are stated in unwrapped form, using only definitions built
    directly from the Brownian driver B: the signature Ŵ_t = paperSig2 B 0 t of
    (t, W_t), the signature filtration sigFiltration B generated by its
    coordinates, the volatility sigVol M B = ⟨ℓ, Ŵ_t⟩, the Itô integral
    kitItoInt B and the quadratic variation kitQuadVar B. Each X_unwrapped is
    proved from the library theorem X (theorem_A, …), which states the
    corresponding claim through the ProlongedBrownianSetup / ItoCalculusKit
    packaging; the unwrapped definitions agree with the packaged ones
    definitionally. The packaged SignaturePriceSolution represents the price by
    the Doléans exponential at every outcome; the unwrapped predicate
    IsSignaturePrice requires almost surely continuous paths on [0, T] and
    almost sure equality to that exponential at each time. Compared:
    theorem_A_unwrapped, theorem_B_mp_unwrapped, theorem_D_unwrapped (proved);
    not_affine_riccati_duality_mpr_unwrapped,
    not_affine_riccati_duality_unwrapped, not_theorem_B_mpr_unwrapped,
    not_theorem_B_unwrapped, not_theorem_C_unwrapped,
    theorem_D_residual_hypothesis_fails_unwrapped, not_literal_nflvr_unwrapped,
    not_terminal_bdd_nflvr_unwrapped (refutations). Proved: theorem_A_unwrapped
    — for every SignatureVolatilityModel (which includes d ≥ 1, T > 0, s₀ > 0,
    HypH1, HypH2, and parameter nondegeneracy ℓ ≠ 0) and every Brownian driver,
    under the additional analytic hypothesis HypH3 on the signature volatility,
    there exists a price process S with IsSignaturePrice (S₀ = s₀, measurable,
    adapted to the signature filtration, strictly positive, with almost surely
    continuous paths on [0, T] and, at each t ∈ [0, T], almost sure equality to
    the Doléans exponential s₀ exp(∫σ dW − ½∫σ² ds), satisfying the integral
    equation S_t = s₀ + ∫_0^t S σ dW almost surely for each t ∈ [0, T], with
    square-integrable supremum, and a martingale on the signature filtration),
    and S is unique among processes that are measurable with respect to the
    signature filtration, lie in KitStrongSolutionClass, and satisfy the
    integral equation, almost everywhere on [0, T]; theorem_B_mp_unwrapped —
    under the same HypH3, there exists such an S that is a martingale on the
    signature filtration, SatisfiesNFLVR_DS holds for the Delbaen–Schachermayer
    cone BoundedBelowGains of uniformly bounded-below admissible strategies whose
    integrand H S σ lies in the ℱ^W-predictable L² space and whose wealth is a
    continuous genuine L² Itô integral against W⁰ (narrower than the paper's
    local class ∫ H² d⟨S⟩ < ∞ almost surely), for that same process S, every
    signature coordinate is a special semimartingale for the signature
    filtration, and the → direction of
    Theorem 4.2(ii) holds (if the exponential-affine conditional-expectation
    formula holds through some classical Riccati solution, then a classical
    Riccati solution exists). This is not a proof of the paper's full Theorem B,
    whose conjunction includes the ← direction of the iff; theorem_D_unwrapped —
    for every Market (a model, a Brownian driver and HypH3, with price S =
    sigPrice, the Doléans exponential) and every X in L²(ℱ^S_T), there is a
    unique GKW decomposition X = (∫ X) · 1 + G + ε with G in the gains space H0
    and orthogonal to constants, ε in L²(ℱ^S_T) ∩ H0⊥ and orthogonal to the
    gains set, and the Pythagorean identity. This does not identify G as a
    stochastic integral ∫ H dS. Refuted by Lean counterexamples:
    not_affine_riccati_duality_mpr_unwrapped — for every
    SignatureVolatilityModel and every Brownian driver, with no analytic HypH3
    hypothesis, it is not the case that every finitely supported u₀ with finite
    signature transform and some classical Riccati solution admits a classical
    Riccati solution ψ for which E[exp⟨u₀, Ŵ_T⟩ | ℱ_t] = exp⟨ψ(T − t), Ŵ_t⟩
    almost surely for all t ∈ [0, T]. The proof uses the family u₀^(λ) = 2λ
    e_[1,1,1] − λ e_[1,0] − 12λ² e_[1,1,1,1,0] (λ ≥ 1), for which ℛ(u₀^(λ)) = 0
    and the signature transform is finite (Lean proves ∫ exp⟨u₀^(λ), Ŵ_t⟩ dP ≤
    1). Lean does not state a theorem that this exponential is a local
    martingale or that it is not a true martingale; what is compared is the
    failure of the universal conditional-expectation formula;
    not_affine_riccati_duality_unwrapped — under the same hypotheses (every
    model and driver, no HypH3), the paper's iff in Theorem 4.2(ii) is false as
    a universal statement over such u₀; not_theorem_B_mpr_unwrapped and
    not_theorem_B_unwrapped — the same ← failure, and the failure of the paper's
    full Theorem B conjunction, each stated with an additional unused HypH3
    hypothesis, so they apply to every model and driver for which analytic HypH3
    holds (HypH3 is satisfiable; it holds for constant volatility);
    not_theorem_C_unwrapped — for the Black–Scholes market (T > 0, s₀ > 0, σ₀ ≠
    0, one-dimensional Brownian motion) and every finite set of call strikes,
    the unconditional equivalence "complete with finitely many calls on ℱ^S_T ⇔
    N^*_S < ∞" is false, and the paper's separate claim that Black–Scholes has
    completeness depth N^*_S = 0 is likewise false: the market is complete, but
    under Definition 55 one has N^*_S = ∞. This is not a counterexample inside
    Theorem 56's finite-polynomial subcase K(N^*_S) < ∞ with a strike set rich
    enough to span polynomials in S_T of degree at most K(N^*_S). Here complete
    means that every X in L²(ℱ^S_T) is almost surely c +
    Σ_k a_k (S_T − k)^+ + G with G in the L²-closed span of the elementary
    Brownian integrals Σ_p h_p (W_{p.2} − W_{p.1}) over intervals 0 ≤ p.1 ≤ p.2
    ≤ T with h_p bounded and σ(W_u : u ≤ p.1)-measurable;
    theorem_D_residual_hypothesis_fails_unwrapped — for Black–Scholes (same
    parameters as above), ¬ (N^*_S < ∞). This shows that the residual-expansion
    hypothesis of Theorem D fails for Black–Scholes; it does not refute the
    expansion identity on markets where the hypothesis holds;
    not_literal_nflvr_unwrapped — for Black–Scholes (T > 0, s₀ > 0, σ₀ ≠ 0,
    1-dimensional Brownian motion), literal NFLVR (Defs 2.17 and 4.3, no wealth
    lower bound) fails: a geometric-grid doubling strategy, transferred by H =
    K/(S σ₀), is S-admissible and ends at V_T = 1 a.s.;
    not_terminal_bdd_nflvr_unwrapped — the same free lunch is in the terminal-
    only bounded-below cone of Section 4.6. Neither claim refutes
    Delbaen–Schachermayer NFLVR, which requires a uniform-in-time lower bound
    and, in the Lean statement, an integrand H S σ in ℱ^W-predictable L² with
    wealth a continuous genuine L² Itô integral against W⁰, narrower than the
    paper's local class, and is proved at that strength for the unwrapped
    signature-price process in theorem_B_mp_unwrapped. The geometric-grid doubling construction and the
    distinction among the three NFLVR wordings, as well as the scaled-tensor
    disproof of the converse Riccati duality, are due to Gemini Carbon.
    Supporting results, proved in the library with no sorry but not compared:
    the wrapped forms theorem_A, theorem_B_mp, theorem_D,
    not_affine_riccati_duality_mpr, not_affine_riccati_duality,
    not_theorem_B_mpr, not_theorem_B, not_theorem_C (with MathFin's Itô integral
    of square-integrable predictable integrands as the gains),
    theorem_D_residual_hypothesis_fails, not_literal_nflvr and
    not_terminal_bdd_nflvr; affine_riccati_duality_mp — for every model and
    driver and every finitely supported u₀ with finite signature transform, if
    the exponential-affine conditional-expectation formula holds through some
    classical Riccati solution, then a classical Riccati solution exists;
    theorem_C_refuted — the same refutation of the unconditional equivalence
    and of the Black–Scholes depth claim as not_theorem_C;
    blackScholes_isCompleteWithCalls — Black–Scholes is complete on ℱ^S_T with
    finitely many calls, for every finite strike set;
    theorem_C_blackScholes_depth_infinite and
    blackScholes_completenessDepth_eq_top — its completeness depth is infinite;
    theorem_C_depth_infinite — N^*_S = ∞ and no finite-depth signature span is
    dense, for every MarketData whose L²(ℱ^S_T) is infinite-dimensional;
    not_prop58_blackScholes_depth_zero — Black–Scholes completeness depth is not
    0; not_lemma77_shuffle_estimate — for every weight w and every letter ℓ in
    Fin d, there is no constant C such that ‖e_I ⧢ e_J‖_w ≤ C ‖e_I‖_w ‖e_J‖_w
    for all words I, J; not_lemma77_of_hypH2 is the same conclusion with an
    unused HypH2 hypothesis, hence also for every H2 weight;
    not_lemma78_local_lipschitz — only for the weight w ≡ 1 (Weight.constOne),
    on ExtTensorAlgebra (d+2) for every d, the Riccati operator is not locally
    Lipschitz on bounded subsets of T_w. Every compared claim is either proved
    or refuted at the stated strength. A short mathematical narrative is given
    for each counterexample. Every compared theorem uses only propext,
    Quot.sound and Classical.choice. Project rule: no Lean `axiom` declarations.
    Akmal Xodarev did not participate in or endorse this formalization. Lean was
    written with AI-agent assistance under Lars Warren Ericson's direction and
    review.
