known_gaps:
  - >-
    No open problems. False paper claims are registered through their Lean
    negations, not the claims; each has a short narrative in
    Writeup/narratives/. Theorem 4.2(ii) ← / Theorem B
    (not_affine_riccati_duality_mpr, not_affine_riccati_duality,
    not_theorem_B_mpr, not_theorem_B): for every model and driver, the family
    u₀^(λ) = 2λe_[1,1,1] − λe_[1,0] − 12λ²e_[1,1,1,1,0] has ℛ(u₀^(λ)) = 0 and
    E exp⟨u₀^(λ),Ŵ_t⟩ ≤ 1, but Brownian scaling gives
    E[exp⟨u₀^(λ),Ŵ_T⟩ | ℱ_t] = exp⟨u₀^(λ),Ŵ_t⟩·v₁(λ^{1/3}W_t) with v₁ → 0 at +∞;
    a Riccati representation for all λ would make log v₁ an entire function
    of exponential type 0 with quartic growth, hence a polynomial bounded on
    (−∞, 0], hence constant — contradiction. The H3 argument of the Theorem B
    forms is unused (H3 is satisfiable, e.g. Black–Scholes).
  - >-
    Theorem C, Proposition 58 and the Theorem D residual hypothesis: in
    Black–Scholes W_T is a function of S_T, so L²(ℱ^S_T) is
    infinite-dimensional, while Definition 55 depth N spans finitely many
    signature coordinates; hence N^*_S = ∞ (not 0), although the market is
    complete by Brownian martingale representation. Theorem D's residual
    expansion is shown vacuous for Black–Scholes, not false.
  - >-
    Lemma 77: ℓ^k ⧢ ℓ = (k+1)ℓ^{k+1} defeats any shuffle constant, for every
    weight. Lemma 78: for w ≡ 1, ℛ(e_{ℓ^{k+1}}) has coefficient ½·binom(2k,k)
    at ℓ^{2k}, so ℛ is unbounded on the unit ball.

limitations:
  - >-
    No external mathematical review has been performed.
  - >-
    Source PDF/TeX and OCR transcriptions are not Apache-2.0; see NOTICE.

