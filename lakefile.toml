name = "xodarev2026"
defaultTargets = ["SignatureVolatility", "SignatureVolatilityChallenge", "SignatureVolatilitySolution", "OpenProblems"]

# Module-system port: privateInPublic keeps transitional private decls visible
# from public sections (same pattern as nowakowska1982 / lyasoff2016).
moreLeanArgs = [
  "-Dbackward.privateInPublic=true",
  "-Dbackward.privateInPublic.warn=false",
]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

# Prefer lyasoff2016’s pruned BM path pin over upstream RemyDegenne (unused
# BM `sorry`s poison Palomar). MathFin path pin matches lyasoff’s Git SHA.
# Stochastic-Process-lean-lib and LeanRoughPaths live under vendor/ but are
# not Lake requires until their toolchains match (see vendor/SOURCES).
[[require]]
name = "BrownianMotion"
path = "vendor/brownian-motion"

[[require]]
name = "MathFin"
path = "vendor/formal-mathfin"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "e91b128082cc221d6432a6a5aadcd3243af8e76c"

[[lean_lib]]
name = "SignatureVolatility"
globs = ["SignatureVolatility", "SignatureVolatility.+"]
[[lean_lib]]
name = "SignatureVolatilityChallenge"
roots = ["SignatureVolatilityComparator.Challenge"]


[[lean_lib]]
name = "SignatureVolatilitySolution"
roots = ["SignatureVolatilityComparator.Solution"]


# Not submitted to Palomar: the single open problem (`affine_riccati_duality_mpr`, `sorry`) and
# the results that depend on it (`affine_riccati_duality`, `signatureRiccatiKit_of_setup`,
# full `theorem_B`). Its root `OpenProblems.lean` imports every module under `OpenProblems/`.
[[lean_lib]]
name = "OpenProblems"
globs = ["OpenProblems", "OpenProblems.+"]
